# Conduit — R4S 上的 /opt/stacks/conduit/compose.yaml
# 由 GitHub Actions 部署时从仓库拷过去，不要在服务器上直接改（改了会被下次部署覆盖）。
#
# 一个服务：web/ 目录的 Next.js 应用，管理后台 + 网关（/v1/*）。CI 构建后推到 GHCR。
# 和 R4S 其他 stack 一致：network_mode: host + restart: unless-stopped。
# 端口：3000（gh-mcp）、4000（个人站）已被占用，这里用 3012。

services:
  web:
    image: ghcr.io/leonardo-zhu/conduit-web:${WEB_TAG:-latest}
    container_name: conduit-web
    restart: unless-stopped
    network_mode: host
    # global.env：R4S 各 stack 共享的密钥，这里只用其中 OpenClaw 默认机器人的 TELEGRAM_BOT_TOKEN_DEFAULT
    # 和 TELEGRAM_CHAT_ID 推送事件（同 imap-service 的做法），令牌改了只改那一处。
    # .env：管理员账号、会话密钥、主密钥、PASSKEY_ORIGIN，模板见 .env.example。只在服务器上维护；后加载，同名的以它为准
    env_file:
      - /opt/stacks/.secrets/global.env
      - .env
    environment:
      - PORT=3012
      # 只给同机的 Caddy 访问：IP 白名单和登录限速信任 X-Forwarded-For，不能让外部直连
      - HOSTNAME=127.0.0.1
      - TZ=Asia/Shanghai
      - CONDUIT_DATA_DIR=/data
      - NODE_OPTIONS=--max-old-space-size=128
    volumes:
      # 容器里以 node 用户（uid 1000）运行，首次部署前 chown 1000:1000 这个目录
      - ${CONDUIT_HOST_DIR:-/opt/conduit}/web/data:/data
    mem_limit: 256m
    labels:
      - "app=conduit"
