name: Deploy to Docker

on:
  push:
    branches:
      - master
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: deploy-docker
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/conduit-adapter

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push adapter image
        uses: docker/build-push-action@v6
        with:
          context: adapter
          push: true
          platforms: linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build
    runs-on: [self-hosted, r4s]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Conduit on Self-hosted Runner
        run: |
          set -euo pipefail
          DEPLOY_DIR="/opt/stacks/conduit"

          if [ ! -f "$DEPLOY_DIR/.env" ]; then
            echo "ERROR: $DEPLOY_DIR/.env 不存在，请先按 docs/setup.md 完成首次准备"
            exit 1
          fi

          # compose.yaml 以仓库为准，每次部署覆盖服务器上的副本；.env 只在服务器上维护
          cp compose.yaml "$DEPLOY_DIR/compose.yaml"
          cd "$DEPLOY_DIR"

          # Login to GHCR on host
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

          # 固定到本次构建的镜像；new-api 的版本由 compose.yaml 决定
          export ADAPTER_TAG="${{ github.sha }}"
          docker compose pull
          docker compose up -d --remove-orphans

          # Automatically clean up dangling old images left after updates (<none>:<none>)
          docker image prune -f
