name: Deploy to Docker

on:
  push:
    branches:
      - master
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: deploy-docker
  cancel-in-progress: true

env:
  WEB_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/conduit-web

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          platforms: linux/arm64
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
          tags: |
            ${{ env.WEB_IMAGE_NAME }}:latest
            ${{ env.WEB_IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build
    runs-on: [self-hosted, r4s]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Conduit on Self-hosted Runner
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          DEPLOY_DIR="/opt/stacks/conduit"

          if [ ! -f "$DEPLOY_DIR/.env" ]; then
            echo "ERROR: $DEPLOY_DIR/.env 不存在，请先按 docs/setup.md 完成首次准备"
            exit 1
          fi

          # compose.yaml 以仓库为准，每次部署覆盖服务器上的副本；.env 只在服务器上维护
          cp compose.yaml "$DEPLOY_DIR/compose.yaml"
          cd "$DEPLOY_DIR"

          # R4S 经 OpenClash 访问 ghcr.io，偶尔会断（EOF），登录和拉取都重试几次
          retry() {
            for i in 1 2 3 4 5; do
              "$@" && return 0
              echo "第 $i 次失败，10 秒后重试：$*"
              sleep 10
            done
            return 1
          }

          # Login to GHCR on host
          retry sh -c 'echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin'

          # 固定到本次构建的镜像。--remove-orphans 会顺带删掉已从 compose 移除的旧容器（new-api、adapter）
          export WEB_TAG="${{ github.sha }}"
          retry docker compose pull
          docker compose up -d --remove-orphans

          # Automatically clean up dangling old images left after updates (<none>:<none>)
          docker image prune -f
